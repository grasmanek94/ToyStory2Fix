[ToyStory2Fix]
; Adjusts the games timing to attempt to fix framerate issues on newer computers.
FixFramerate = true

; Allows the selection of 32-bit "true" colour resolutions.
Allow32Bit = true

; Ignores the amount of VRAM when enumerating graphics processors. This fixes the "Unable to enumerate a suitable device" error.
IgnoreVRAM = true

; Allows the copyright and ESRB screens to be skipped immediately with Space/Jump.
SkipSplash = true

; Enables mouse-controlled camera yaw and pitch during normal gameplay and visor aiming.
; Normal gameplay orbits the camera without turning Buzz, in either camera mode.
; Original keyboard/controller actions are preserved, including Tab entering visor mode.
MouseLook = true
; Game-angle units applied per mouse pixel. Valid range: 0.1 to 32.0.
MouseSensitivity = 4.0
InvertMouseX = false
InvertMouseY = false

; Left mouse button fires (default Left Ctrl); right mouse button toggles visor view (default Tab).
; Keeps keyboard/controller bindings; works independently of MouseLook.
MouseButtons = true

; Increases the render distance of the main level geometry to the recommended maximum*. Prevents areas of the level disappearing when they are far from the camera. Strongly recommended when using widescreen.
; *recommended maximum = sqrtf(FLT_MAX), thanks to WinterSnowfall from d7vk.
IncreaseRenderDistance = true
; Value used for the increased render distance (only applies if IncreaseRenderDistance = true).
; Accepts a number (plain/scientific, optional 'f' eg: 1e12f), SQRT_FLT_MAX (default), or INFINITY; keywords are case-insensitive.
; 1.45e8f is closest to the game's original render distance.
RenderDistanceValue = SQRT_FLT_MAX

; Displays 3D graphics in the correct aspect-ratio when widescreen resolutions are selected.
Widescreen = true

; Fixes texture-mapping bugs.
TextureFix = true

; Fixes broken disk launcher at 60 FPS.
DiskFix = true

; Fixes fast Zurg and other flying enemies at 60 FPS.
ZurgFix = true

IncreaseEnemyRenderDistance = true

